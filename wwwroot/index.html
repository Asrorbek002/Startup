<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisob - Tizimga kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Telegram ikonkalari uchun Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0d9488 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .bg-radar-circles-top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            height: 350px;
            pointer-events: none;
            z-index: 2;
        }

        .bg-radar-circles-bottom-right {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 2;
        }

        .radar-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            animation: radarPulse 4s infinite linear;
            opacity: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

            .radar-ring:nth-child(2) {
                animation-delay: 1.3s;
            }

            .radar-ring:nth-child(3) {
                animation-delay: 2.6s;
            }

        @keyframes radarPulse {
            0% {
                transform: scale(0.1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatShape 10s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
            animation-duration: 12s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #10b981;
            bottom: -150px;
            right: -150px;
            animation-duration: 15s;
        }

        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 40px) scale(1.1);
            }
        }

        .login-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            border-radius: 18px;
            overflow: hidden;
            padding: 3px;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

            .login-card-wrapper::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, #38bdf8 330deg, #4ade80 360deg);
                animation: rotateBorder 4s linear infinite;
            }

        @keyframes rotateBorder {
            100% {
                transform: rotate(360deg);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px 45px;
            position: relative;
            z-index: 2;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="bg-radar-circles-top-left">
        <div class="radar-ring"></div><div class="radar-ring"></div><div class="radar-ring"></div>
    </div>
    <div class="bg-radar-circles-bottom-right">
        <div class="radar-ring"></div><div class="radar-ring"></div><div class="radar-ring"></div>
    </div>
    <div class="background-shapes">
        <div class="shape shape-1"></div><div class="shape shape-2"></div>
    </div>

    <div class="login-card-wrapper">
        <div class="login-card">
            <div class="d-flex justify-content-end mb-3">
                <div class="dropdown">
                    <button class="btn btn-sm btn-light border dropdown-toggle py-1 px-2 text-muted small" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="currentLangBtn">
                        🇺🇿 O'zbekcha
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="font-size: 13px;">
                        <li><a class="dropdown-item" href="#" onclick="changeLanguage('uz')">🇺🇿 O'zbekcha</a></li>
                        <li><a class="dropdown-item" href="#" onclick="changeLanguage('ru')">🇷🇺 Русский</a></li>
                    </ul>
                </div>
            </div>

            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary">MyHisob</h4>
                <h5 class="fw-semibold" data-i18n="loginTitle">Tizimga kirish</h5>
                <p class="text-muted small" data-i18n="subTitle">Boshqaruv paneli</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-muted small" data-i18n="loginLabel">Login</label>
                    <input type="text" class="form-control py-2" id="loginInput" placeholder="Login" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small" data-i18n="passwordLabel">Parol</label>
                    <input type="password" class="form-control py-2" id="passwordInput" placeholder="parol" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3" data-i18n="submitBtn">Kirish</button>
            </form>

            <div class="text-start mb-2">
                <span id="errorMsg" class="text-danger fw-semibold small"></span>
            </div>

            <div class="text-center mt-3">
                <a href="#" class="text-decoration-none small text-muted" data-i18n="forgotPassword" onclick="openForgot(event)">Maxfiy so'zni unutdingizmi?</a>
            </div>
            <hr class="my-4">

            <!-- Footer qismi (Telegram ikonka va murojaat qo'shildi) -->
            <div class="text-center text-muted" style="font-size: 11px;">
                <span data-i18n="footerText">
                    Ishlab chiqaruvchi: ООО «_________», O'zbekiston Respublikasi<br>
                    Biznesni avtomatlashtirish uchun dasturiy ta'minot<br>
                    📞 +998 94 568 12 11
                </span>
                <div class="mt-2">
                    <a href="https://t.me/TuronApex" target="_blank" class="text-decoration-none text-primary fw-bold d-inline-flex align-items-center gap-1">
                        <i class="bi bi-telegram fs-6 text-info"></i> @TuronApex
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Parolni tiklash oynasi -->
    <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold" id="fpTitle"></h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="fpStep1">
                        <p class="text-muted small" id="fpInfo1"></p>
                        <label class="form-label small text-muted" id="fpLoginLbl"></label>
                        <input type="text" class="form-control mb-3" id="fpLogin" autocomplete="username">
                        <button type="button" class="btn btn-primary w-100" id="fpSendBtn" onclick="fpSendCode()"></button>
                    </div>
                    <div id="fpStep2" class="d-none">
                        <p class="text-muted small" id="fpInfo2"></p>
                        <input type="text" class="form-control text-center fs-4 mb-3" id="fpCode" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" style="letter-spacing:8px;">
                        <button type="button" class="btn btn-primary w-100 mb-2" id="fpVerifyBtn" onclick="fpVerify()"></button>
                        <button type="button" class="btn btn-outline-secondary w-100 btn-sm" id="fpResendBtn" onclick="fpSendCode(true)" disabled></button>
                    </div>
                    <div id="fpStep3" class="d-none">
                        <label class="form-label small text-muted" id="fpNewPassLbl"></label>
                        <input type="password" class="form-control mb-2" id="fpNewPass" autocomplete="new-password">
                        <label class="form-label small text-muted" id="fpNewPass2Lbl"></label>
                        <input type="password" class="form-control mb-3" id="fpNewPass2" autocomplete="new-password">
                        <button type="button" class="btn btn-success w-100" id="fpSaveBtn" onclick="fpSavePassword()"></button>
                    </div>
                    <div id="fpStep4" class="d-none text-center">
                        <div class="fs-1 text-success">&#10004;</div>
                        <p class="fw-semibold" id="fpDoneMsg"></p>
                        <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal" id="fpDoneBtn"></button>
                    </div>
                    <div class="small mt-3 fw-semibold" id="fpMsg"></div>
                </div>
                <div class="modal-footer justify-content-center text-muted" style="font-size:12px;" id="fpContact"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const translations = {
            uz: {
                currentBtn: "🇺🇿 O'zbekcha", loginTitle: "Tizimga kirish", subTitle: "Boshqaruv paneli",
                loginLabel: "Login", passwordLabel: "Parol", submitBtn: "Kirish",
                forgotPassword: "Maxfiy so'zni unutdingizmi?",
                footerText: "Ishlab chiqaruvchi: ООО «_________», O'zbekiston Respublikasi<br>Biznesni avtomatlashtirish uchun dasturiy ta'minot<br>📞 +998 94 568 12 11",
                errorServer: "Server bilan aloqa yo'q!", errorLogin: "Login yoki parol xato!"
            },
            ru: {
                currentBtn: "🇷🇺 Русский", loginTitle: "Вход в систему", subTitle: "Панель управления",
                loginLabel: "Логин", passwordLabel: "Пароль", submitBtn: "Войти",
                forgotPassword: "Забыли пароль?",
                footerText: "Производитель: ООО «_________», Республика Узбекистан<br>Программное обеспечение для автоматизации бизнеса<br>📞 +998 94 568 12 11",
                errorServer: "Нет связи с сервером!", errorLogin: "Неверный логин или пароль!"
            }
        };

        let currentLang = localStorage.getItem("appLang") || "uz";

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("appLang", lang);
            applyTranslations();
        }

        function applyTranslations() {
            const t = translations[currentLang];
            document.getElementById("currentLangBtn").innerHTML = t.currentBtn;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (t[key]) el.innerHTML = t[key];
            });
        }

        document.addEventListener("DOMContentLoaded", () => { applyTranslations(); });

        // ===== Parolni tiklash (email orqali kod) =====
        const fpText = {
            uz: {
                title: "Parolni tiklash", loginLbl: "Login", send: "Kod yuborish", resend: "Kodni qayta yuborish",
                info1: "Loginingizni kiriting. Admin tomonidan biriktirilgan emailga tasdiqlash kodi yuboriladi.",
                info2: "Emailga yuborilgan 6 xonali kodni kiriting (5 daqiqa amal qiladi). Xat kelmasa, Spam papkasini ham tekshiring.",
                verify: "Tasdiqlash", newPass: "Yangi parol (kamida 8 belgi)", newPass2: "Yangi parolni takrorlang", save: "Saqlash",
                done: "Parol yangilandi. Endi yangi parol bilan kirishingiz mumkin.", close: "Kirishga o'tish",
                contact: "Email biriktirilmagan bo'lsa yoki kod kelmasa, administratorga murojaat qiling:<br>📞 +998 94 568 12 11 &nbsp; <b>@TuronApex</b>",
                needLogin: "Loginni kiriting", sent: "Agar login mavjud va unga email biriktirilgan bo'lsa, kod yuborildi.",
                needCode: "6 xonali kodni kiriting", badCode: "Kod noto'g'ri yoki muddati tugagan.",
                shortPass: "Parol kamida 8 belgidan iborat bo'lishi kerak", mismatch: "Parollar bir xil emas",
                expired: "Sessiya muddati tugagan. Qaytadan urinib ko'ring.", server: "Server bilan aloqa yo'q!", wait: "Qayta yuborish"
            },
            ru: {
                title: "Восстановление пароля", loginLbl: "Логин", send: "Отправить код", resend: "Отправить код повторно",
                info1: "Введите логин. Код подтверждения будет отправлен на email, привязанный администратором.",
                info2: "Введите 6-значный код из письма (действует 5 минут). Если письма нет, проверьте папку «Спам».",
                verify: "Подтвердить", newPass: "Новый пароль (минимум 8 символов)", newPass2: "Повторите новый пароль", save: "Сохранить",
                done: "Пароль обновлён. Теперь вы можете войти с новым паролем.", close: "Перейти ко входу",
                contact: "Если email не привязан или код не приходит, обратитесь к администратору:<br>📞 +998 94 568 12 11 &nbsp; <b>@TuronApex</b>",
                needLogin: "Введите логин", sent: "Если логин существует и к нему привязан email, код отправлен.",
                needCode: "Введите 6-значный код", badCode: "Код неверный или срок его действия истёк.",
                shortPass: "Пароль должен содержать минимум 8 символов", mismatch: "Пароли не совпадают",
                expired: "Сессия истекла. Попробуйте снова.", server: "Нет связи с сервером!", wait: "Повторно"
            }
        };
        const fpT = k => fpText[currentLang][k];
        const fpState = { login: "", token: "", timer: null, modal: null };

        function fpMsg(text, ok) {
            const el = document.getElementById("fpMsg");
            el.textContent = text || "";
            el.className = "small mt-3 fw-semibold " + (ok ? "text-success" : "text-danger");
        }

        function fpShowStep(n) {
            for (let i = 1; i <= 4; i++) document.getElementById("fpStep" + i).classList.toggle("d-none", i !== n);
        }

        function fpApplyLang() {
            const set = (id, v) => { document.getElementById(id).textContent = v; };
            set("fpTitle", fpT("title")); set("fpLoginLbl", fpT("loginLbl")); set("fpSendBtn", fpT("send"));
            set("fpInfo1", fpT("info1")); set("fpInfo2", fpT("info2")); set("fpVerifyBtn", fpT("verify"));
            set("fpNewPassLbl", fpT("newPass")); set("fpNewPass2Lbl", fpT("newPass2")); set("fpSaveBtn", fpT("save"));
            set("fpDoneMsg", fpT("done")); set("fpDoneBtn", fpT("close"));
            document.getElementById("fpContact").innerHTML = fpT("contact");
            if (!fpState.timer) set("fpResendBtn", fpT("resend"));
        }

        function fpStartCooldown() {
            const btn = document.getElementById("fpResendBtn");
            let left = 60;
            btn.disabled = true;
            clearInterval(fpState.timer);
            btn.textContent = fpT("wait") + " (" + left + ")";
            fpState.timer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(fpState.timer); fpState.timer = null;
                    btn.disabled = false; btn.textContent = fpT("resend");
                } else {
                    btn.textContent = fpT("wait") + " (" + left + ")";
                }
            }, 1000);
        }

        async function fpPost(url, body) {
            const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
            let data = {};
            try { data = await r.json(); } catch (e) { }
            return { ok: r.ok, data };
        }

        function openForgot(e) {
            if (e) e.preventDefault();
            if (!fpState.modal) fpState.modal = new bootstrap.Modal(document.getElementById("forgotModal"));
            clearInterval(fpState.timer); fpState.timer = null;
            fpState.token = "";
            fpApplyLang();
            fpMsg("");
            document.getElementById("fpLogin").value = document.getElementById("loginInput").value.trim();
            document.getElementById("fpCode").value = "";
            document.getElementById("fpNewPass").value = "";
            document.getElementById("fpNewPass2").value = "";
            fpShowStep(1);
            fpState.modal.show();
        }

        async function fpSendCode(isResend) {
            const login = isResend ? fpState.login : document.getElementById("fpLogin").value.trim();
            if (!login) { fpMsg(fpT("needLogin")); return; }
            fpMsg("");
            const btn = document.getElementById(isResend ? "fpResendBtn" : "fpSendBtn");
            btn.disabled = true;
            try {
                await fpPost("/api/auth/forgot", { login });
                fpState.login = login;
                fpShowStep(2);
                fpStartCooldown();
                fpMsg(fpT("sent"), true);
                document.getElementById("fpCode").focus();
            } catch (err) {
                console.error(err);
                fpMsg(fpT("server"));
                if (!isResend) btn.disabled = false;
            }
            if (!isResend) btn.disabled = false;
        }

        async function fpVerify() {
            const code = document.getElementById("fpCode").value.trim();
            if (!/^\d{6}$/.test(code)) { fpMsg(fpT("needCode")); return; }
            fpMsg("");
            try {
                const res = await fpPost("/api/auth/verify-code", { login: fpState.login, code });
                if (res.ok && res.data.resetToken) {
                    fpState.token = res.data.resetToken;
                    fpShowStep(3);
                    fpMsg("");
                    document.getElementById("fpNewPass").focus();
                } else {
                    fpMsg(fpT("badCode"));
                }
            } catch (err) {
                console.error(err);
                fpMsg(fpT("server"));
            }
        }

        async function fpSavePassword() {
            const p1 = document.getElementById("fpNewPass").value;
            const p2 = document.getElementById("fpNewPass2").value;
            if (p1.length < 8) { fpMsg(fpT("shortPass")); return; }
            if (p1 !== p2) { fpMsg(fpT("mismatch")); return; }
            fpMsg("");
            try {
                const res = await fpPost("/api/auth/reset-password", { resetToken: fpState.token, newPassword: p1 });
                if (res.ok) {
                    fpState.token = "";
                    document.getElementById("loginInput").value = fpState.login;
                    document.getElementById("passwordInput").value = "";
                    fpShowStep(4);
                    fpMsg("");
                } else {
                    fpMsg(fpT("expired"));
                }
            } catch (err) {
                console.error(err);
                fpMsg(fpT("server"));
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const login = document.getElementById("loginInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();
            const errorSpan = document.getElementById("errorMsg");
            const t = translations[currentLang];

            errorSpan.textContent = "";

            if (login === "admin" && password === "admin_2002") {
                window.location.href = "admin.html";
                return;
            }

            try {
                let response = await fetch('/api/shop-cabinet/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: login, password: password })
                });

                let result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem("currentShopId", result.shopId);
                    localStorage.setItem("shopName", result.shopName);
                    localStorage.setItem("shopLogin", login);

                    window.location.href = "cabinet.html";
                    return;
                }


                let empResponse = await fetch('/api/shop-cabinet/employee-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: login, password: password })
                });

                let empResult = await empResponse.json();

                if (empResponse.ok && empResult.success) {
                    localStorage.setItem("currentShopId", empResult.shopId);
                    localStorage.setItem("shopName", empResult.shopName);
                    localStorage.setItem("currentEmployeeId", empResult.employeeId);
                    localStorage.setItem("employeeName", empResult.employeeName);
                    localStorage.setItem("employeeLogin", login);

                    window.location.href = "employee-cabinet.html";
                    return;
                }

                errorSpan.textContent = empResult.message || result.message || t.errorLogin;
            } catch (err) {
                console.error(err);
                errorSpan.textContent = t.errorServer;
            }
        }
    </script>
</body>
</html>
